<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#030303">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="format-detection" content="telephone=no">
<title>Cue</title>
<style>
@font-face{font-family:"CueOmni";src:url("/font.ttf") format("truetype");font-display:block}
:root{--bg:#030303;--sheet:#0b0b0b;--hover:#1a1a1a;--press:#262626;--edge:#232323;--faint:#303030;--dim:#787878;--fg:#ededed;--px:#ffffff;--orange:#ffaa5a}
html,body{margin:0;min-height:100%;background:var(--bg);overflow-x:hidden;overscroll-behavior:none;touch-action:manipulation}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;color:var(--fg);font-family:"CueOmni",ui-monospace,monospace;font-size:20px;line-height:24px;-webkit-font-smoothing:none;-webkit-text-size-adjust:100%}
svg{shape-rendering:crispEdges;display:block}
button{font:inherit;color:inherit;background:transparent;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none}
#viewport{box-sizing:border-box;min-height:100vh;min-height:100dvh;padding: max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
#remoteFrame{position:relative;margin:0 auto}
#app{position:absolute;left:0;top:0;width:390px;height:844px;transform-origin:0 0;overflow:hidden}
button:focus-visible{outline:2px solid var(--px);outline-offset:3px}
#stage{z-index:1;pointer-events:none}#stage button,#stage #frame{pointer-events:auto}
#menu,#subEdit{background:var(--bg)}
#bFolder{color:var(--fg)}
.abs{position:absolute}
.hide{display:none!important}
.ell{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell{position:absolute;width:10px;height:10px;transition:background-color .7s linear,opacity .7s linear}
.dot{position:absolute;width:8px;height:8px}
.wbtn{position:absolute;display:flex;align-items:center;justify-content:center;color:var(--dim);border-radius:2px}
.wbtn:active{color:var(--px)}
.wbtn[disabled]{opacity:.35}
.center{position:absolute;left:114px;top:114px;width:116px;height:116px;color:var(--fg)}
.center:active .cfill{fill:var(--press)}
.row{display:flex;justify-content:space-between;align-items:center;width:100%;height:var(--row-h,40px);padding:0 12px;border-radius:2px;box-sizing:border-box;color:var(--dim);text-align:left}
.row.on{color:var(--fg)}
.row.edit{background:var(--press);color:var(--fg)}
.adj{width:var(--hit,44px);height:var(--hit,44px);background:var(--sheet);border:2px solid var(--edge);border-radius:2px;color:var(--fg)}
.adj:active{background:var(--press)}
.card{position:absolute;box-sizing:border-box;background:var(--sheet);border:2px solid var(--edge);border-radius:2px;text-align:left;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.card:active{background:var(--hover)}
.icon{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:2px;color:var(--dim)}
.tile{background:var(--sheet);border:2px solid var(--edge);border-radius:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px 6px;box-sizing:border-box;min-width:0;height:110px}
.tile.sel{border-color:var(--px);animation:boing .45s var(--spring)}
.ftile{display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.thumb{position:relative;display:block;width:100%;height:96px;box-sizing:border-box;border:2px solid var(--edge);border-radius:2px;overflow:hidden;background:#0b0b0b}
.ftile.sel .thumb{border-color:var(--px)}
.ftile.sel{animation:boing .45s var(--spring)}
.thumb img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated}
.prog{position:absolute;left:0;bottom:0;height:4px;background:var(--px)}
.prog.done{background:var(--dim)}
.zz{position:absolute;opacity:0;animation:zf 2.4s steps(8) infinite}
@keyframes zf{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(14px,-44px);opacity:0}}
.bp{position:absolute;width:6px;height:6px;background:var(--px);animation-duration:.65s;animation-timing-function:steps(6);animation-fill-mode:forwards}
.b1{animation-name:b1}.b2{animation-name:b2}.b3{animation-name:b3}.b4{animation-name:b4}.b5{animation-name:b5}.b6{animation-name:b6}
@keyframes b1{to{transform:translate(-44px,-34px);opacity:0}}@keyframes b2{to{transform:translate(44px,-34px);opacity:0}}
@keyframes b3{to{transform:translate(-66px,-6px);opacity:0}}@keyframes b4{to{transform:translate(66px,-6px);opacity:0}}
@keyframes b5{to{transform:translate(-22px,-54px);opacity:0}}@keyframes b6{to{transform:translate(22px,-54px);opacity:0}}
.digits{display:flex;gap:8px;justify-content:center}
.digit{width:42px;height:60px;box-sizing:border-box;border:2px solid var(--edge);border-radius:2px;background:var(--sheet);display:flex;align-items:center;justify-content:center;font-size:40px;line-height:48px}
.digit.cur{border-color:var(--dim)}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center}
.key{height:max(56px,var(--hit,44px));border:2px solid var(--edge);border-radius:2px;background:var(--sheet);font-size:30px;line-height:36px}
.key:active{background:var(--press)}
#grid{-webkit-overflow-scrolling:touch;touch-action:pan-y}
:root{--spring:cubic-bezier(.34,1.56,.64,1)}
@supports (transition-timing-function:linear(0,1)){:root{--spring:linear(0, 0.054, 0.185, 0.357, 0.538, 0.708, 0.853, 0.967, 1.047, 1.097, 1.122, 1.126, 1.116, 1.098, 1.075, 1.053, 1.032, 1.015, 1.001, 0.992, 0.987, 0.984, 0.984, 0.986, 0.988, 0.991, 0.994, 0.997, 0.999, 1)}}
.wbtn,.center,.icon,.tile,.ftile,.row,.card,.key,.crumb{transition:transform .5s var(--spring)}
.wbtn:active:not([disabled]),.icon:active,.key:active,.crumb:active:not([disabled]){transform:scale(.84);transition-duration:.07s;transition-timing-function:ease-out}
.center:active{transform:scale(.93);transition-duration:.07s;transition-timing-function:ease-out}
.tile:active,.ftile:active,.card:active{transform:scale(.94);transition-duration:.07s;transition-timing-function:ease-out}
.rise{animation:rise .55s var(--spring) both}
@keyframes rise{from{transform:translateY(14px) scale(.96);opacity:0}30%{opacity:1}to{transform:none;opacity:1}}
.popin{animation:popin .5s var(--spring) both}
@keyframes popin{from{transform:scale(.4);opacity:0}25%{opacity:1}to{transform:none;opacity:1}}
.slideup{animation:slideup .55s var(--spring) both}
@keyframes slideup{from{transform:translateY(40px);opacity:0}30%{opacity:1}to{transform:none;opacity:1}}
.boing{animation:boing .45s var(--spring)}
@keyframes boing{from{transform:scale(.9)}to{transform:none}}
#rowHi{position:absolute;left:0;right:0;height:var(--row-h,40px);border-radius:2px;background:var(--hover);transition:transform .45s var(--spring)}
.crumb{display:flex;align-items:center;gap:10px;color:var(--dim);max-width:100%;height:var(--hit,44px)}
.crumb[disabled]{cursor:default;color:var(--dim)}
.flash{animation:flash .3s steps(3)}
@keyframes flash{0%{background:var(--press);color:var(--px)}100%{}}
.thumb img{opacity:0;transition:opacity .24s steps(3)}
.thumb img.ok{opacity:1}
#scrub.peeking #peekImg{opacity:1}
#peekImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;opacity:0;transition:opacity .15s steps(3)}
#peekShade{position:absolute;left:0;right:0;bottom:0;height:64px;background:linear-gradient(transparent,rgba(0,0,0,.85));opacity:0}
#scrub.peeking #peekShade{opacity:1}
#scrub.peeking #scrubT{top:86px;font-size:30px;line-height:36px}
#scrub.peeking #scrubD{top:118px;font-size:16px;line-height:20px;color:var(--fg)}
#linked{z-index:7;background:var(--bg);display:flex;flex-direction:column;align-items:center}
#linked .eyes{margin-top:190px;display:flex;gap:56px;animation:popin .3s steps(5) both}
#linked .cf{position:absolute;left:195px;top:240px;width:8px;height:8px;animation:cf 1.1s steps(10) both}
@keyframes cf{0%{transform:translate(0,0);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
#linked.out{animation:fadeout .3s steps(4) both}
@keyframes fadeout{to{opacity:0}}
#grid::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion: reduce){#rowHi,.wbtn,.center,.icon,.tile,.ftile,.row,.card,.key,.crumb{transition:none!important}.tile.sel,.ftile.sel,.boing{animation:none}.zz,.bp,.cf{animation:none;display:none}.cell,.thumb img,#peekImg{transition:none}.rise,.popin,.slideup,.flash,#linked .eyes,#linked.out{animation:none}}
</style>
</head>

<script>
/*CUE_BOOT*/
(function () {
'use strict';
var BOOT = window.CUE || { strings: {}, lang: 'en' };
document.documentElement.lang = BOOT.lang || 'en';
function t(k, args) {
  var s = BOOT.strings[k] || k;
  if (args) for (var a in args) s = s.split('{' + a + '}').join(args[a]);
  return s;
}
var $ = function (id) { return document.getElementById(id); };

// ── pixel helpers ─────────────────────────────────────────────────
var BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
function gridPath(W, H, fn) {
  var d = '';
  for (var y = 0; y < H; y++) {
    var x = 0;
    while (x < W) {
      if (fn(x, y)) { var s0 = x; while (x < W && fn(x, y)) x++; d += 'M' + s0 + ' ' + y + 'h' + (x - s0) + 'v1h' + (s0 - x) + 'z'; }

    }
  }
  return d;
}
function bmp(w, h, cells) { return gridPath(w, h, function (x, y) { return cells.charAt(y * w + x) === '#'; }); }
function disc(D, r, off) {
  off = off || 0;
  var c = D / 2;
  var d = gridPath(D, D, function (x, y) { var xx = x + .5 - c, yy = y + .5 - c; return xx * xx + yy * yy <= r * r; });
  return off ? d.replace(/M(\d+) (\d+)/g, function (m, a, b) { return 'M' + (+a + off) + ' ' + (+b + off); }) : d;
}
function sprite(w, h, cells) { return { d: bmp(w, h, cells), w: w * 20, h: h * 20 }; }
var EYES = { open: sprite(2, 2, '####'), flat: sprite(2, 2, '##..'), closed: sprite(2, 2, '..##'), wide: sprite(3, 3, '####.####'),
  happy: sprite(3, 2, '.#.#.#'), detL: sprite(3, 2, '##...#'), detR: sprite(3, 2, '.###..') };
var P = {
  rew: bmp(8, 5, '...#...#..##..##.###.###..##..##...#...#'), fwd: bmp(8, 5, '#...#...##..##..###.###.##..##..#...#...'),
  play: bmp(7, 7, '#......###....#####..############..###....#......'), pause: bmp(7, 7, '##...####...####...####...####...####...####...##'),
  zed: bmp(3, 5, '###..#.#.#..###'), close: bmp(5, 5, '#...#.#.#...#...#.#.#...#'), back: bmp(3, 5, '..#.#.#...#...#'), grip: bmp(3, 5, '#.#...#.#...#.#'),
  folder: bmp(9, 7, ['.###.....', '#...#####', '#.......#', '#.......#', '#.......#', '#.......#', '#########'].join('')),

function replay(el, cls) { if (reduced) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

// ── input: buttons ────────────────────────────────────────────────
// in a menu or a folder the four buttons move the selection, like the wheel does
function navStep(dir) {

var held = false, holdT = 0;
$('bBack').addEventListener('pointerdown', function () {
  held = false; clearTimeout(holdT);

  holdT = setTimeout(function () { held = true; tick(); what(); }, 450);
});
['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { $('bBack').addEventListener(ev, function () { clearTimeout(holdT); }); });
$('bBack').addEventListener('click', function () {
  if (held) { held = false; return; }

  tick();
  if (U.menu) { navBack(); return; }
  skip(-15);
});
$('bFwd').addEventListener('click', function () { if (U.browse !== null) { gridMove('right'); return; } tick(); if (inNav()) center(); else skip(15); });
$('bPlay').addEventListener('click', function () { if (U.browse !== null) { gridMove('down'); return; } if (inNav()) { navStep(1); return; } tick(); togglePlay(); });
$('crumbBtn').addEventListener('click', function () { if (!browseCanUp()) return; tick(); browseUp(); });
$('browseClose').addEventListener('click', function () { tick(); closeBrowse(); });
// the arrow beside a menu's title: one step back (a value to the list, the subtitles to the menu, the menu to the player)
$('menuTitle').addEventListener('click', function () { tick(); navBack(); });
$('subEditBack').addEventListener('click', function () { tick(); navBack(); });
// ── no zoom: the page already fits the phone, and quick taps (+ + +) must stay taps ──

(function () {

    var now = Date.now(), c = e.changedTouches[0], still = c && Math.abs(c.clientX - sx) < 10 && Math.abs(c.clientY - sy) < 10;

})();
$('bMenu').addEventListener('click', function () {
  if (U.browse !== null) { gridMove('up'); return; }
  if (inNav()) { navStep(-1); return; }
  tick();
  if (S.view === 'play') { U.menu = 'main'; U.idx = 0; }
  render();
});
$('bCenter').addEventListener('click', function () { tick(); center(); });
$('bFolder').addEventListener('click', function () { tick(); if (U.browse !== null) closeBrowse(); else openBrowse(''); });
$('next').addEventListener('click', function () { tick(); send({ c: 'next' }); celebrate(); });
$('rows').addEventListener('click', function (e) {
  var a = e.target.closest('[data-adj]');
  if (a) { tick(); adjust(U.edit, +a.getAttribute('data-adj')); return; }
  var r = e.target.closest('[data-row]');
  if (r) { tick(); act(+r.getAttribute('data-row')); }

$('subMinus').addEventListener('click', function () { tick(); adjust(U.edit, -1); });
$('subPlus').addEventListener('click', function () { tick(); adjust(U.edit, 1); });
function togglePlay() {

}
function skip(n) {

  holdOn('pos');

}
function what() {

  if (U.edit) { U.edit = null; toast(t('remote.saved')); return; }
  if (U.menu) { act(U.idx); return; }
  if (S.view !== 'play') { openBrowse(''); return; }
  if (nextVisible()) { send({ c: 'next' }); celebrate(); return; }
  U.mode = U.mode === 'tempo' ? 'volume' : 'tempo';
  toast(U.mode === 'tempo' ? t('remote.mode_time') : t('remote.volume'));

// ── input: double tap on the eyes pauses ──────────────────────────
var lastTap = 0;
$('stage').addEventListener('pointerup', function (e) {
  if (e.target.closest('button') || U.menu || S.view !== 'play') return;
  var now = performance.now();
  if (now - lastTap < 320) { lastTap = 0; tick(); togglePlay(); } else lastTap = now;
});

// ── input: the bar (seek, or volume) ──────────────────────────────
var barDrag = false;
function barFrac(e) { var r = $('bar').getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); }

  if (S.view !== 'play') return;
  barDrag = true; try { $('bar').setPointerCapture(e.pointerId); } catch (x) {}
  barMove(e);
});
function barMove(e) {
  if (!barDrag) return;
  var f = barFrac(e);
  if (U.mode === 'volume') { S.vol = Math.round(f * 125); holdOn('vol'); send({ c: 'vol', v: S.vol }, true); }
  else { if (!U.scrub) scrubStart(); U.scrub = true; U.step = 5; U.prev = Math.min(S.dur, f * S.dur); peek(); }
  render();
}
$('bar').addEventListener('pointermove', barMove);
function barUp() {
  if (!barDrag) return;
  barDrag = false;
  if (U.scrub) { U.scrub = false; clearPeek(); S.pos = U.prev; stamp = performance.now(); holdOn('pos'); send({ c: 'seek', v: U.prev }); toast(fmt(U.prev)); }
  render();
}
$('bar').addEventListener('pointerup', barUp);
$('bar').addEventListener('pointercancel', barUp);

// ── input: the subtitle, dragged in its little screen ─────────────
var frameDrag = false;
$('frame').addEventListener('pointerdown', function (e) {
  if (U.edit !== 'pos') return;
  frameDrag = true; try { $('frame').setPointerCapture(e.pointerId); } catch (x) {}
  frameMove(e);
});
function frameMove(e) {
  if (!frameDrag) return;
  var r = $('frame').getBoundingClientRect(), f = 1 - (e.clientY - r.top) / r.height;
  var v = Math.max(S.sub.posMin, Math.min(S.sub.posMax, Math.round(100 - (f * 100 - 4))));
  if (v !== S.sub.pos) { tick(); S.sub.pos = v; holdOn('sub.pos'); send({ c: 'subpos', v: v }, true); render(); }
}
$('frame').addEventListener('pointermove', frameMove);
['pointerup', 'pointercancel'].forEach(function (ev) { $('frame').addEventListener(ev, function () { frameDrag = false; }); });

// ── input: the wheel ──────────────────────────────────────────────
var drag = null;

$('wheel').addEventListener('pointerdown', function (e) {

    var tipAngle = Math.max(0, Math.min(1, livePos() / (S.dur || 1))) * 360;
    var delta = ((g.a - tipAngle + 540) % 360) - 180;

function detent(dir) {

$('wheel').addEventListener('pointerup', wheelUp);

// ── keep the screen on while it is a remote (where the browser allows it) ──
var lock = null;

// ── go ────────────────────────────────────────────────────────────
render();
if (codeFromLink) connect(codeFromLink);
else if (token) connect(null);
else showPair('');
document.addEventListener('visibilitychange', function () { if (!document.hidden && !ws && token) { retry = 0; connect(null); } });
})();
